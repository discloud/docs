        apps:
          type: array
          items:
            type: string
          description: Lista de IDs das aplicações pertencentes
          x-gitbook-description-html: <p>Lista de IDs das aplicações pertencentes</p>
        plan:
          type: string
          description: O plano de assinatura
          x-gitbook-description-html: <p>O plano de assinatura</p>
        locale:
          type: string
          description: O idioma/localização
          x-gitbook-description-html: <p>O idioma/localização</p>
        lastDataLeft:
          type: object
          properties:
            days:
              type: integer
              description: Dias restantes no plano atual
              x-gitbook-description-html: <p>Dias restantes no plano atual</p>
            hours:
              type: integer
              description: Horas restantes no plano atual
              x-gitbook-description-html: <p>Horas restantes no plano atual</p>
            minutes:
              type: integer
              description: Minutos restantes no plano atual
              x-gitbook-description-html: <p>Minutos restantes no plano atual</p>
            seconds:
              type: integer
              description: Segundos restantes no plano atual
              x-gitbook-description-html: <p>Segundos restantes no plano atual</p>
          description: Tempo restante do plano atual
          x-gitbook-description-html: <p>Tempo restante do plano atual</p>
        planDataEnd:
