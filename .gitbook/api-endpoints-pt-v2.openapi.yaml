paths:
  /user:
    get:
      tags:
      - Usuário
      summary: Obter informações do usuário atual
      description: Retorna informações sobre o usuário autenticado
      operationId: getCurrentUser
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                status: ok
                message: Os dados do usuário foram carregados com sucesso
                user:
                  userID: '803658045736878080'
                  totalRamMb: 16384
                  ramUsedMb: 3386
                  subdomains:
                  - exemplo
                  customdomains:
                  - example.discloud.com
                  apps:
                  - '1719010867306'
                  plan: Safira
                  locale: pt-BR
                  lastDataLeft:
                    days: 264
                    hours: 12
                    minutes: 6
                    seconds: 56
                  planDataEnd: '2026-01-12T22:28:58.189Z'
          x-gitbook-description-html: <p>Operação bem-sucedida</p>
        '401':
