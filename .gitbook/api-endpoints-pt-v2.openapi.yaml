      tags:
      - Bancos de Dados
      summary: Criar banco de dados
      description: >-
        Inicia o provisionamento assíncrono de um banco gerenciado. Devolve HTTP 200
        de imediato com o novo id. Consulte GET /database/{dbID} até o recurso
        existir e estar online. Plano mínimo Diamond (4). projectID opcional cobra
        a quota do dono do project e exige acesso de admin.
      operationId: createDatabase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - displayName
              - db
              - totalRam
              properties:
                displayName:
                  type: string
                  description: Nome amigável (obrigatório)
                db:
                  type: object
                  required:
                  - type
                  - version
                  properties:
                    type:
                      type: string
                      description: Motor (postgres, mysql, mariadb, mongodb, redis, valkey, …)
                    version:
                      type: string
                    extensions:
                      type: array
                      items:
                        type: string
                    port:
                      type: integer
                vars:
                  type: object
                  additionalProperties:
                    type: string
                  description: Credenciais/env em texto plano (não envie varsEncrypted)
                totalRam:
                  type: integer
                  minimum: 100
                  description: RAM em MB (mínimo 100)
                projectID:
                  type: string
                  description: Projecto opcional a vincular
                autoRestart:
                  type: boolean
            example:
              displayName: My Postgres staging
              db:
                type: postgres
                version: '17'
              vars:
                POSTGRES_DB: app_db
                POSTGRES_USER: app_rw
                POSTGRES_PASSWORD: secret
              totalRam: 512
      responses:
        '200':
          description: Criação iniciada
          content:
            application/json:
              schema:
                type: object
              example:
                status: ok
                id: 1714500000365db
                message: A base de dados está a ser criada. Acompanhe o progresso consultando o recurso.
          x-gitbook-description-html: <p>Criação iniciada</p>
        '400':
          description: Corpo inválido (campos em falta, varsEncrypted na criação, vars inválidas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-gitbook-description-html: <p>Corpo inválido</p>
        '401':
          description: Erro de autenticação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-gitbook-description-html: <p>Erro de autenticação</p>
        '403':
          description: Plano ou quota de RAM insuficiente
          content:
            application/json:
              schema:
