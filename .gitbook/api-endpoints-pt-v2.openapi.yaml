          x-gitbook-description-html: <p>Corpo inválido</p>
        '401':
          description: Erro de autenticação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-gitbook-description-html: <p>Erro de autenticação</p>
        '403':
          description: Sem permissão ou plano/quota insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-gitbook-description-html: <p>Sem permissão ou plano/quota insuficiente</p>
        '404':
          description: Banco de origem ou projeto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-gitbook-description-html: <p>Banco de origem ou projeto não encontrado</p>
        '429':
