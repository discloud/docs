  /database/{dbID}/restore:
    post:
      tags:
      - Bancos de Dados
      summary: Restaurar backup como novo banco
      description: >-
        Cria um novo banco gerenciado a partir de um backup (assíncrono).
        Exige backup_app no banco de origem. Plano mínimo Diamond (4).
        Devolve o novo id de imediato; consulte GET /database/{id}.
      operationId: restoreDatabaseBackup
      parameters:
      - name: dbID
        in: path
        required: true
        description: ID do banco de origem (dono do backup)
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - backupId
              - totalRam
              properties:
                backupId:
                  type: string
                totalRam:
                  type: integer
                  minimum: 100
                displayName:
                  type: string
                projectID:
                  type: string
                vars:
                  type: object
                  additionalProperties:
                    type: string
                varsEncrypted:
                  type: string
                  description: Mutuamente exclusivo com vars
                autoRestart:
                  type: boolean
                db:
                  type: object
                  properties:
                    version:
                      type: string
            example:
              backupId: 20240101120000
              totalRam: 512
              displayName: Restored Postgres
      responses:
        '200':
          description: Restauro iniciado
          content:
            application/json:
              schema:
                type: object
              example:
                status: ok
                id: 1714500000999db
                message: O restauro a partir do backup foi iniciado. Acompanhe o progresso consultando o recurso.
