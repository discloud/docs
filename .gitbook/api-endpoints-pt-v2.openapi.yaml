        ambiente obrigatórias/opcionais e o mapa `fromSuggestions` (suggested* → env)
        para montar o body do POST /database sem hardcodar nomes.
      operationId: listDatabasePresets
      responses:
        '200':
          description: Presets carregados com sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                status: ok
                data:
                  databases:
                  - type: postgres
                    versions:
                    - '16'
                    - '17'
                    extensions:
                    - pgvector
                    defaultPort: 5432
                    suggestedDisplayName: Nova base Brisa
                    suggestedDbName: brisa-aurora
                    suggestedUser: brisa
                    suggestedPassword: a1b2c3d4e5f6
                    vars:
                      required:
                      - POSTGRES_DB
                      - POSTGRES_USER
                      - POSTGRES_PASSWORD
                      optional: []
                      fromSuggestions:
                        POSTGRES_DB: suggestedDbName
                        POSTGRES_USER: suggestedUser
                        POSTGRES_PASSWORD: suggestedPassword
          x-gitbook-description-html: <p>Presets carregados com sucesso</p>
        '401':
          description: Erro de autenticação
