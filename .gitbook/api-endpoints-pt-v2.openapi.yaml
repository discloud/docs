        avatarURL:
          type: string
          description: URL para a imagem do avatar da aplicação
          x-gitbook-description-html: <p>URL para a imagem do avatar da aplicação</p>
        name:
          type: string
          description: Nome da aplicação
          x-gitbook-description-html: <p>Nome da aplicação</p>
        type:
