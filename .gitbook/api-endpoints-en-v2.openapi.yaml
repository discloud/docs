                      description: Engine (postgres, mysql, mariadb, mongodb, redis, valkey, …)
                    version:
                      type: string
                    extensions:
                      type: array
                      items:
                        type: string
                    port:
                      type: integer
                vars:
                  type: object
                  additionalProperties:
                    type: string
