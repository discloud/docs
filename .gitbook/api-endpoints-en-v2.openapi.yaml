paths:
  /user:
    get:
      tags:
        - User
      summary: Get current user information
      description: Returns information about the authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: ok
                message: User data were successfully charged
                user:
                  userID: "803658045736878080"
                  totalRamMb: 16384
                  ramUsedMb: 3386
                  subdomains:
                    - exemplo
                  customdomains:
                    - example.discloud.com
                  apps:
                    - "1719010867306"
                  plan: Safira
                  locale: pt-BR
                  lastDataLeft:
                    days: 264
                    hours: 12
                    minutes: 6
                    seconds: 56
                  planDataEnd: "2026-01-12T22:28:58.189Z"
          x-gitbook-description-html: <p>Successful operation</p>
        "401":
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noToken:
                  value:
                    message: Block
                  summary: No token provided
                invalidToken:
                  value:
                    message: Please provide a valid token
                  summary: Invalid token provided
          x-gitbook-description-html: <p>Authentication error</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: Returns information about the authenticated user
                    marks: []
      x-gitbook-description-html: <p>Returns information about the authenticated user</p>
  /locale/{locale}:
    put:
      tags:
        - User
      summary: Update user locale
      description: Updates the user's preferred language/locale
      operationId: updateUserLocale
      parameters:
        - name: locale
          in: path
          required: true
          description: The locale to set for the user
          schema:
            type: string
            enum:
              - pt-BR
              - en-US
          x-gitbook-description-html: <p>The locale to set for the user</p>
      responses:
        "200":
          description: Locale successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocaleResponse"
              example:
                status: ok
                locale: en-US
